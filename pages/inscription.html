<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>
    <div class="container">
        <header class="H">
            <div class="DH">
                <div class="logo">
                    <h2>HTS</h2>
                </div>
                <h1>HighTechStore</h1>
            </div>
            <nav>
                <a href="../index.html">Acceuil</a>
                <a href="pc.html">PC</a>
                <a href="inscription.html" class="AC">Inscription</a>
                <a href="info.html">Infos</a>
                <a href="A propos.html">A propos</a>
            </nav>
        </header>
        <main class="M">
            <div class="card">
                <h2>Formulaire d'Inscription</h2>
                <form action="">
                    <div class="divf">
                        <div><label for="nom">Nom :</label>
                            <input type="text" name="nom" class="inp">
                        </div>
                        <div><label for="prenom">Prenom :</label>
                            <input type="text" name="prenom" class="inp">
                        </div>
                        <div><label for="dn">Date de naissance :</label>
                            <input type="date" name="dn" class="inp">
                        </div>
                        <div><label for="Sexe">Sexe : </label>
                            <div class="dr">
                                <input type="radio" name="sexe" class="inp radio" value="Masculin">
                                <span>Masculin</span>
                                <input type="radio" name="sexe" class="inp radio" value="Feminin"> <span>Feminin</span>
                            </div>
                        </div>
                        <div><label for="adresse">Adresse :</label>
                            <input type="text" name="adr" class="inp">
                        </div>
                        <div><label for="cd">Code postal :</label>
                            <input type="number" name="cd" class="inp">
                        </div>
                        <div><label for="ville">Ville :</label>
                            <input type="text" name="ville" class="inp">
                        </div>
                        <div><label for="gouv">Gouvernorat :</label>
                            <select class="inp" name="gouv">
                                <option value="0" selected>-- Choisir un Gouvernorat --</option>
                                <option value=""></option>
                                <option value=""></option>
                                <option value=""></option>
                            </select>
                        </div>
                        <div><label for="fonction">Fonction :</label>
                            <input type="text" name="fonction" class="inp">
                        </div>
                        <div><label for="email">Adresse E-mail :</label>
                            <input type="email" name="email" class="inp" placeholder="nom@exemple.com">
                        </div>
                        <div><label for="tel">Numero de telephone :</label>
                            <input type="tel" name="tel" class="inp">
                        </div>
                        <div class="dta">
                            <label for="remarque">Remarque :</label><br>
                            <textarea name="remarque" id="" placeholder="Vos remarques ou precisions..."></textarea>
                        </div>
                    </div>
                    <input type="submit" value="Valider l'inscription" id="sub" width="100%">
                </form>
        </main>
        <footer class="F">
            <div>&copy; HighTechStore - Tous droits reserves | Auteur : Votre nom et prenom</div>
        </footer>
    </div>
</body>

</html>
